<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<title>Capa · Engenharia de Inferência</title>
<link rel="stylesheet" href="fontes.css">
<link rel="stylesheet" href="estilo.css">
<style>
  @page { size: 7in 10in; margin: 0; }
  html, body { margin: 0; padding: 0; }
  :root[data-theme="dark"] { --papel: #0d1729; --linha: #22304a; }
  body {
    width: 7in; height: 10in; overflow: hidden;
    background: var(--papel);
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
  }
  .capa {
    box-sizing: border-box;
    width: 100%; height: 100%;
    padding: 15mm 15mm 13mm;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .sobre {
    font-family: var(--fonte-mono); font-size: 9.5pt;
    letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--destaque); margin: 0 0 7mm;
  }
  .titulo {
    font-family: var(--fonte-titulo); font-weight: 700;
    font-size: 54pt; line-height: 0.98; letter-spacing: -0.01em;
    color: #f2f5fa; margin: 0 0 6mm;
  }
  .sub {
    font-family: var(--fonte-texto); font-size: 13.5pt; line-height: 1.4;
    color: #b9c4d8; margin: 0; max-width: 30em;
  }
  .grafico { margin: 0 -3mm; }
  .grafico .roofline .ponto { stroke: var(--papel); }
  .rodape {
    display: flex; justify-content: space-between; gap: 6mm;
    border-top: 1px solid #2c3b57; padding-top: 4mm;
    font-family: var(--fonte-mono); font-size: 8.5pt; color: #93a1b8;
    letter-spacing: 0.04em;
  }
</style>
</head>
<body>
<div class="capa">
  <div>
    <p class="sobre">Guia de entrevistas · 1ª edição · 2026</p>
    <p class="titulo">Engenharia<br>de Inferência</p>
    <p class="sub">Os 14 temas e as 50 perguntas que caem em OpenAI, Anthropic, NVIDIA, Google e outras empresas, explicados do zero até o nível sênior.</p>
  </div>
  <div class="grafico">{{ROOFLINE}}</div>
  <div class="rodape">
    <span>14 capítulos</span><span>50 perguntas comentadas</span><span>código testado</span>
  </div>
</div>
</body>
</html>
