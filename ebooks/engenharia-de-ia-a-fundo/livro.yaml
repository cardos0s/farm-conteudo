legenda: >-
  Um modelo de linguagem não escreve frases: a cada passo, ele dá uma
  probabilidade para cada token do vocabulário, e um deles é sorteado.
  Quase tudo neste livro muda alguma parte deste gráfico: como as
  probabilidades foram aprendidas, o que entra no contexto, que tokens
  são permitidos e quanto custa calculá-las.
creditos:
  - >-
    Os 17 conceitos seguem a Parte 2 da série
    [“64 AI Engineering Concepts, Clearly Explained”](https://newsletter.systemdesign.one/p/advanced-ai-concepts-explained),
    de Neo Kim (newsletter System Design One), conceitos 18 a 34. As
    explicações, exemplos, contas, códigos, testes e flashcards desta
    edição são originais.
  - >-
    Números de modelos, hardware e desempenho são aproximados e servem
    para raciocínio. Os blocos de código em Python foram executados;
    os marcados como ilustrativos dependem de bibliotecas externas.
