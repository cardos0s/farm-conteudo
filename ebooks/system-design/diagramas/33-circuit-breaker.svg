<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="lousa-33-circuit-breaker-t lousa-33-circuit-breaker-d" font-family="Excalifont, Virgil, 'Comic Sans MS', cursive" class="lousa">
<title id="lousa-33-circuit-breaker-t">Os três estados de um circuit breaker</title>
<desc id="lousa-33-circuit-breaker-d">O breaker começa fechado: as chamadas passam e as falhas são contadas. Se a taxa de falhas passa do limite, ele abre e passa a falhar na hora, sem chamar o serviço. Depois do tempo de espera, vai para meio-aberto e deixa passar poucas chamadas de teste. Se os testes dão certo, volta a fechado; se falham, volta a aberto.</desc>
