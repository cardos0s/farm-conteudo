<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="lousa-46-dead-letter-queue-t lousa-46-dead-letter-queue-d" font-family="Excalifont, Virgil, 'Comic Sans MS', cursive" class="lousa">
<title id="lousa-46-dead-letter-queue-t">O caminho de uma mensagem até a DLQ e de volta</title>
<desc id="lousa-46-dead-letter-queue-d">A fila principal tem as mensagens 881 a 884; a 881 está envenenada. 1: a fila entrega a 881 ao consumidor. 2: o consumidor falha, não confirma, e a mensagem volta para a fila; isso se repete três vezes. 3: depois da terceira falha, a mensagem vai para a dead letter queue (DLQ), e a fila segue com as outras. 4: uma engenheira inspeciona a mensagem e corrige o bug. 5: ela faz o replay, devolvendo a 881 para a fila principal.</desc>
