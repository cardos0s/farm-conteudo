<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260" role="img" aria-labelledby="lousa-37-heartbeat-t lousa-37-heartbeat-d" font-family="Excalifont, Virgil, 'Comic Sans MS', cursive" class="lousa">
<title id="lousa-37-heartbeat-t">Heartbeat e timeout</title>
<desc id="lousa-37-heartbeat-d">O nó manda um heartbeat por segundo para o monitor. Depois do quinto sinal, o nó morre. O monitor não percebe na hora: ele espera o timeout de 5 segundos sem nenhum sinal e só então declara a falha e dispara o failover.</desc>
