<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440" role="img" aria-labelledby="lousa-06-amdahl-t lousa-06-amdahl-d" font-family="Excalifont, Virgil, 'Comic Sans MS', cursive" class="lousa">
<title id="lousa-06-amdahl-t">Lei de Amdahl: aceleração por número de máquinas</title>
<desc id="lousa-06-amdahl-d">Gráfico em escala da aceleração obtida com N máquinas, de 1 a 64, para três frações sequenciais. Com 5% sequencial, a curva chega a cerca de 15 vezes com 64 máquinas e tende a um teto de 20 vezes. Com 20% sequencial, chega a 4 vezes com 16 máquinas e a 4,7 com 64, perto do teto de 5 vezes. Com 50% sequencial, a curva fica quase plana logo no começo, perto do teto de 2 vezes. Uma linha tracejada cinza mostra o ideal, sem parte sequencial, em que N máquinas dariam N vezes.</desc>
