<title id="lousa-05-throughput-latencia-t">Latência explode perto de 100% de utilização</title>
<desc id="lousa-05-throughput-latencia-d">Gráfico em escala da latência média de um servidor com fila, em que cada requisição exige 10 ms de trabalho, conforme a utilização sobe. Com 50% de utilização, a latência média é 20 ms; com 80%, 50 ms; com 90%, 100 ms; com 95%, 200 ms. Perto de 100%, a fila cresce sem limite e a curva dispara.</desc>
