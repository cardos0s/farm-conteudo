<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 352" width="720" height="352" role="img" aria-labelledby="lousa-48-sla-slo-sli-t lousa-48-sla-slo-sli-d" font-family="Excalifont, Virgil, 'Comic Sans MS', cursive" class="lousa">
<title id="lousa-48-sla-slo-sli-t">SLA, SLO e SLI numa régua de disponibilidade</title>
<desc id="lousa-48-sla-slo-sli-d">Uma régua de disponibilidade mensal, de 99,4% a 100%. O SLA do contrato fica em 99,5%: abaixo dele, o contrato foi violado e há multa ou créditos. O SLO interno fica em 99,9%: entre 99,5% e 99,9% o contrato está cumprido, mas a meta interna foi furada e a equipe congela deploys. Acima de 99,9%, o SLO está cumprido. O SLI medido no mês é 99,95%. A faixa entre 99,9% e 100% é o orçamento de erro: 0,1% de 30 dias, ou seja, 0,1% de 43.200 minutos, igual a 43,2 minutos fora do ar. Ampliada, ela mostra que o SLI de 99,95% gastou 21,6 minutos e ainda sobram 21,6.</desc>
