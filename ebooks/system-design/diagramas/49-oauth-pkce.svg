<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" width="720" height="460" role="img" aria-labelledby="lousa-49-oauth-pkce-t lousa-49-oauth-pkce-d" font-family="Excalifont, Virgil, 'Comic Sans MS', cursive" class="lousa">
<title id="lousa-49-oauth-pkce-t">Fluxo Authorization Code com PKCE</title>
<desc id="lousa-49-oauth-pkce-d">Diagrama de sequência com quatro participantes: usuário, aplicação (o cliente OAuth), servidor de autorização e API. 1: a aplicação manda o navegador para /authorize com scope=openid e o code_challenge. 2: o usuário faz login e dá o consentimento direto no servidor de autorização; a senha fica lá. 3: o servidor devolve um code à aplicação, por redirect do navegador. 4: a aplicação envia o code e o code_verifier ao servidor, numa chamada direta. O servidor confere se o hash do verifier bate com o challenge. 5: o servidor responde com o access token e, por causa do OIDC, com o ID token. 6: a aplicação chama a API com o access token no cabeçalho Bearer. Setas tracejadas passam pelo navegador; setas contínuas são chamadas diretas. O ID token diz à aplicação quem é o usuário; o access token é só para a API.</desc>
