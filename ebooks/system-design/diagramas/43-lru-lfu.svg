<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440" role="img" aria-labelledby="lousa-43-lru-lfu-t lousa-43-lru-lfu-d" font-family="Excalifont, Virgil, 'Comic Sans MS', cursive" class="lousa">
<title id="lousa-43-lru-lfu-t">LRU e LFU num cache com três vagas</title>
<desc id="lousa-43-lru-lfu-d">Em cima, o LRU como uma lista que vai do item usado agora (frente) ao usado há mais tempo (fim). No início, a lista é C, B, A. Ler A move A para a frente: A, C, B. Inserir D com o cache cheio põe D na frente e remove B, o último da lista: D, A, C. Embaixo, o LFU no mesmo momento olha os contadores de acesso: A tem 4, C tem 1 e B tem 9. Ele remove C, o menos acessado, enquanto o LRU removeu B, o mais popular.</desc>
