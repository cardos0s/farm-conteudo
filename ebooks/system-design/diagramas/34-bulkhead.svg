<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-labelledby="lousa-34-bulkhead-t lousa-34-bulkhead-d" font-family="Excalifont, Virgil, 'Comic Sans MS', cursive" class="lousa">
<title id="lousa-34-bulkhead-t">Pool compartilhado vs. bulkhead</title>
<desc id="lousa-34-bulkhead-d">Em cima, sem bulkhead: um único pool de 100 threads; a dependência de recomendações ficou lenta e prendeu todas, e o pedido de checkout é recusado. Embaixo, com bulkhead: 50 threads para checkout, 30 para busca e 20 para recomendações. As 20 de recomendações estão cheias e a próxima chamada é recusada na hora, mas o checkout continua atendendo.</desc>
<rect width="720" height="400" fill="#fdfdfc"/>
<text x="16" y="32" font-size="17" fill="#e03131" text-anchor="start">sem bulkhead: um pool só para tudo</text>
