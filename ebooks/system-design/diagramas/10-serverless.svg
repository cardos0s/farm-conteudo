<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340" role="img" aria-labelledby="lousa-10-serverless-t lousa-10-serverless-d" font-family="Excalifont, Virgil, 'Comic Sans MS', cursive" class="lousa">
<title id="lousa-10-serverless-t">Ciclo de vida dos ambientes de uma função serverless</title>
<desc id="lousa-10-serverless-d">Linha do tempo com eventos chegando de cima e dois ambientes de execução. O primeiro evento não encontra ambiente pronto: a plataforma cria o ambiente 1 e paga um cold start, em laranja, antes de executar a função, em verde. O segundo evento reaproveita o ambiente 1, já quente, e só executa. Depois chegam dois eventos ao mesmo tempo: o ambiente 1 atende um e a plataforma cria o ambiente 2, com novo cold start, para o outro. Sem tráfego, os ambientes são descartados e a escala volta a zero; o evento seguinte paga outro cold start.</desc>
