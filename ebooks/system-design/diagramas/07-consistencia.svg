<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 436" width="720" height="436" role="img" aria-labelledby="lousa-07-consistencia-t lousa-07-consistencia-d" font-family="Excalifont, Virgil, 'Comic Sans MS', cursive" class="lousa">
<title id="lousa-07-consistencia-t">Consistência forte vs. eventual numa linha do tempo</title>
<desc id="lousa-07-consistencia-d">Dois cenários com um primário e uma réplica, e o tempo correndo para a direita. Em ambos, um cliente grava x = 2 no primário, onde antes havia x = 1. Com consistência forte, o primário copia o valor para a réplica e só depois confirma a escrita; uma leitura na réplica em seguida devolve x = 2. Com consistência eventual, o primário confirma na hora e copia depois; uma leitura na réplica logo após a confirmação ainda devolve o valor velho, x = 1, e só uma leitura feita depois que a cópia chega devolve x = 2.</desc>
