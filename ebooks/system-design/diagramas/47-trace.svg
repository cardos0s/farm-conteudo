<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 408" width="720" height="408" role="img" aria-labelledby="lousa-47-trace-t lousa-47-trace-d" font-family="Excalifont, Virgil, 'Comic Sans MS', cursive" class="lousa">
<title id="lousa-47-trace-t">Cascata de spans de um trace de checkout</title>
<desc id="lousa-47-trace-d">Um trace de 1200 ms visto como cascata, no estilo do Jaeger ou do Tempo. Cada linha é um span, desenhado em escala sobre um eixo de 0 a 1200 ms. O gateway (POST /checkout) vai de 0 a 1200 ms. Dentro dele, o serviço de pedidos (criar pedido) vai de 40 a 1180 ms. Pedidos chama o estoque (reservar), de 60 a 130 ms, e depois pagamentos (cobrar cartão), de 140 a 1120 ms. Pagamentos consulta o banco (SELECT em cobranças) de 160 a 1060 ms. Esse span do banco, com 900 ms, está destacado em vermelho como o gargalo: sozinho, ocupa 75% do tempo total.</desc>
