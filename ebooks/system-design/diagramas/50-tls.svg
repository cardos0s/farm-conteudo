<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 396" width="720" height="396" role="img" aria-labelledby="lousa-50-tls-t lousa-50-tls-d" font-family="Excalifont, Virgil, 'Comic Sans MS', cursive" class="lousa">
<title id="lousa-50-tls-t">Handshake do TLS 1.3 em 1 RTT</title>
<desc id="lousa-50-tls-d">Diagrama de sequência entre cliente e servidor, com o tempo correndo para baixo. O cliente envia o ClientHello com as cifras aceitas e a sua key_share. O servidor responde com o ServerHello e a sua key_share e, já cifrados, o certificado, o CertificateVerify e o Finished. Entre a saída do ClientHello e a chegada dessa resposta passa 1 RTT. O cliente confere o certificado, calcula as chaves e envia o seu Finished junto com a primeira requisição HTTP, já cifrados, e daí em diante os dados da aplicação trafegam cifrados nos dois sentidos. Mensagens em preto vão em claro; em verde, cifradas. No TLS 1.2, a mesma conversa levava 2 RTT antes do primeiro dado.</desc>
