<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" width="720" height="460" role="img" aria-labelledby="lousa-38-raft-estados-t lousa-38-raft-estados-d" font-family="Excalifont, Virgil, 'Comic Sans MS', cursive" class="lousa">
<title id="lousa-38-raft-estados-t">Estados de um nó no Raft</title>
<desc id="lousa-38-raft-estados-d">Todo nó começa como seguidor. Se o tempo de eleição acaba sem notícia do líder, ele vira candidato, vota em si e pede votos. Com votos da maioria, por exemplo 3 de 5, vira líder e passa a mandar heartbeats. Em caso de empate, o candidato espera um novo timeout e tenta outra eleição. O candidato volta a seguidor se descobre o líder atual ou um termo maior, e o líder volta a seguidor se descobre um termo maior.</desc>
