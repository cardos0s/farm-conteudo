<title>$title$</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="$description$">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600;700&amp;family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400;1,8..60,600&amp;display=swap">
<style>
/*FONTES*/
/*ESTILO*/
/*WEB*/
</style>
<div class="pagina">
  <header class="abertura">
    <div class="abertura-texto">
      <p class="sobretitulo">$sobretitulo$</p>
      <p class="titulo-livro">$title$</p>
      <p class="subtitulo-livro">$description$</p>
      <p class="autoria"><span class="autora">$author$</span><span class="contato">$handle$</span></p>
      <ul class="numeros" aria-label="Conteúdo do livro">
$for(destaques)$
        <li>$destaques$</li>
$endfor$
      </ul>
    </div>
    <figure class="abertura-grafico">
      <!--ARTE-->
      <figcaption>$legenda$</figcaption>
    </figure>
  </header>
  <div class="corpo">
    <aside class="lateral" aria-label="Sumário">
      <nav class="sumario">
        <p class="sumario-titulo">Sumário</p>
$toc$
      </nav>
    </aside>
    <main class="conteudo">
      <details class="sumario-movel">
        <summary>Sumário</summary>
        <nav class="sumario">
$toc$
        </nav>
      </details>
$body$
      <footer class="creditos">
        <p><strong>$author$</strong> · $handle$</p>
$for(creditos)$
        <p>$creditos$</p>
$endfor$
      </footer>
    </main>
  </div>
</div>
